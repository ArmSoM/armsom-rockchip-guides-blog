---
layout: default
---
<article class="article-shell">
  <p class="eyebrow">TECHNICAL ARTICLE {{ page.name | split: '-' | first }}</p>
  <h1>{{ page.title }}</h1>
  <p class="dek">{{ page.description }}</p>
  <p class="meta">Published {{ page.date | date: "%B %-d, %Y" }} · {{ page.author }}</p>
  <div class="article-content">{{ content }}</div>
  <p class="back"><a href="{{ '/' | relative_url }}#articles">← All articles</a></p>
</article>
