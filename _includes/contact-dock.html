{% assign contact_language = page.lang | default: 'en' %}
{% assign contact_ui = site.data.contact[contact_language] | default: site.data.contact.en %}
<aside class="contact-dock" aria-label="{{ contact_ui.contact | escape }}">
  <button class="contact-trigger contact-wechat" type="button" aria-expanded="false" aria-controls="contact-wechat-panel">
    <svg viewBox="0 0 32 32" width="27" height="27" fill="currentColor" aria-hidden="true"><path d="M13 4C6.9 4 2 7.8 2 12.5c0 2.7 1.6 5.1 4.1 6.7L5 23l4.2-2.2c.8.2 1.7.3 2.5.3a8 8 0 0 1-.7-3.3c0-5 4.8-9 10.7-9h1A11.7 11.7 0 0 0 13 4Zm-4 7.4a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8Zm7 0a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8Z"></path><path d="M22 10.5c-5 0-9 3.2-9 7.2s4 7.3 9 7.3c.8 0 1.6-.1 2.3-.3L28 27l-.9-3.4c2-1.3 3.3-3.4 3.3-5.9 0-4-3.6-7.2-8.4-7.2Zm-3 6a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Zm6 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4Z"></path></svg><span>{{ contact_ui.wechat }}</span>
  </button>
  <a class="contact-trigger contact-whatsapp" href="https://wa.me/8613600462877" target="_blank" rel="noopener noreferrer" aria-label="{{ contact_ui.wa | escape }} (+86 13600462877)">
    <svg viewBox="0 0 32 32" width="27" height="27" fill="currentColor" aria-hidden="true"><path d="M16 .8a15 15 0 0 0-13 22.5L.9 31l7.9-2.1A15.1 15.1 0 1 0 16 .8Zm0 27.5a12.4 12.4 0 0 1-6.3-1.7l-.5-.3-4.7 1.2 1.3-4.5-.3-.5A12.4 12.4 0 1 1 16 28.3Zm6.8-9.3c-.4-.2-2.2-1.1-2.5-1.2-.3-.1-.6-.2-.8.2l-1.1 1.3c-.2.2-.4.3-.8.1a10.2 10.2 0 0 1-3-1.9 11 11 0 0 1-2.1-2.6c-.2-.4 0-.5.2-.7l.6-.7.4-.6c.1-.2 0-.5 0-.7l-1.1-2.6c-.3-.7-.6-.6-.8-.6h-.7c-.3 0-.7.1-1 .5-.3.3-1.3 1.3-1.3 3.1s1.3 3.5 1.5 3.7c.2.3 2.6 4 6.3 5.6.9.4 1.6.6 2.1.7.9.3 1.7.3 2.4.2.7-.1 2.2-.9 2.5-1.7.3-.8.3-1.5.2-1.7-.1-.1-.3-.2-.7-.4Z"></path></svg><span>WhatsApp</span>
  </a>
  <a class="contact-trigger contact-telegram" href="https://t.me/jackson_armsom" target="_blank" rel="noopener noreferrer" aria-label="Telegram: @jackson_armsom">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M21.8 3.2 18.5 20c-.2 1.2-.9 1.5-1.9.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.3L5.8 13.5.9 12c-1.1-.3-1.1-1.1.2-1.6L20.3 3c.9-.3 1.7.2 1.5.2Z"/></svg><span>Telegram</span>
  </a>
  <section id="contact-wechat-panel" class="contact-panel" aria-labelledby="contact-wechat-title" hidden>
    <button class="contact-close" type="button" aria-label="{{ contact_ui.close | escape }}">×</button>
    <h2 id="contact-wechat-title">{{ contact_ui.title }}</h2>
    <p>{{ contact_ui.hint }}</p>
    <img src="{{ '/assets/contact/wechat-qr.png' | relative_url }}" width="411" height="402" alt="{{ contact_ui.alt | escape }}" loading="lazy">
    <p class="contact-services">{{ contact_ui.services }}</p>
    <a class="contact-save" href="{{ '/assets/contact/wechat-qr.png' | relative_url }}" download="ArmSoM-WeChat.png">{{ contact_ui.save }} ↓</a>
    <p class="contact-tip">{{ contact_ui.tip }}</p>
  </section>
</aside>
<script src="{{ '/assets/contact.js' | relative_url }}" defer></script>
