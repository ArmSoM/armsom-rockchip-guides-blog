<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Measure the whole edge application</title><desc id="d">A fast inference call is only one part of the pipeline</desc><rect width="1200" height="630" rx="24" fill="#f1f9fc"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="21" fill="#087d92" font-weight="700">ArmSoM  /  RK3576 · RK3588</text><text x="40" y="103" font-size="36" fill="#173750" font-weight="700">Measure the whole edge application</text><text x="40" y="145" font-size="24" fill="#173750" font-weight="400">A fast inference call is only one part of the pipeline</text><rect x="40" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="58" y="239" font-size="22" fill="#087d92" font-weight="700">INPUT</text><text x="58" y="294" font-size="23" fill="#173750" font-weight="400">Camera / network / storage</text><text x="58" y="349" font-size="23" fill="#173750" font-weight="400">Sensor driver · link mode</text><text x="58" y="404" font-size="23" fill="#173750" font-weight="400">Frame rate · input format</text><text x="392" y="326" font-size="29" fill="#087d92" font-weight="400">→</text><rect x="428" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="446" y="239" font-size="22" fill="#087d92" font-weight="700">PROCESS</text><text x="446" y="294" font-size="23" fill="#173750" font-weight="400">ISP / decoder → RGA → NPU</text><text x="446" y="349" font-size="23" fill="#173750" font-weight="400">CPU logic · buffers · copies</text><text x="446" y="404" font-size="23" fill="#173750" font-weight="400">Model accuracy · queue depth</text><text x="780" y="326" font-size="29" fill="#087d92" font-weight="400">→</text><rect x="816" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="834" y="239" font-size="22" fill="#087d92" font-weight="700">OUTPUT</text><text x="834" y="294" 