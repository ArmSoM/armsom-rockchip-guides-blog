<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Den Chip für die Inferenz bestimmen</title><rect width="1200" height="630" fill="#f2fbfd"/><g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif"><rect width="12" height="630" fill="#34C5DD"/><text x="48" y="54" font-size="24" fill="#08758a" font-weight="700" text-anchor="start">ArmSoM · DEVELOPER HUB</text><text x="48" y="115" font-size="42" fill="#102c46" font-weight="700" text-anchor="start">Den Chip für die Inferenz bestimmen</text><text x="48" y="157" font-size="26" fill="#536a7b" font-weight="400" text-anchor="start">Erst den Softwarestack wählen, dann Pakete installieren</text><rect x="48" y="195" width="528" height="283" rx="22" fill="white" stroke="#b7dfe6" stroke-width="2"/><text x="78" y="243" font-size="24" fill="#537486" font-weight="400" text-anchor="start">Integrierte NPU</text><text x="78" y="296" font-size="32" fill="#102c46" font-weight="700" text-anchor="start">RK3588(S) / RK3576</text><text x="78" y="373" font-size="55" fill="#007c94" font-weight="700" text-anchor="start">RKNN2</text><text x="78" y="434" font-size="28" fill="#102c46" font-weight="400" text-anchor="start">librknnrt.so</text><rect x="624" y="195" width="528" height="283" rx="22" fill="white" stroke="#b7dfe6" stroke-width="2"/><text x="654" y="243" font-size="24" fill="#537486" font-weight="400" text-anchor="start">Integrierte NPU</text><text x="654" y="296" font-size="32" fill="#102c46" font-weight="700" text-anchor="start">RK3572</text><text x="654" y="373" font-size="55" fill="#007c94" font-weight="700" text-anchor="start">RKNN3</text><text x="654" y="434" font-size="28" fill="#102c46" font-weight="400" text-anchor="start">librknn3_api.so</text><text x="48" y="539" font-size="28" fill="#102c46" font-weight="700" text-anchor="start">RK3588-Host + externer RK182X-Beschleuniger</text><text x="48" y="584" font-size="25" fill="#102c46" font-weight="400" text-anchor="start">RK