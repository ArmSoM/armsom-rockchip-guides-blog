<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>RK3688: Richtung des nächsten Flaggschiffs</title><desc>RK3688: Richtung des nächsten Flaggschiffs; Früher veröffentlichte Ziele und aktuelle Fortschritte getrennt betrachten.; Plattformpositionierung; Nächstes Flaggschiff mit fortschrittlicher Fertigung; Früheres GPU-Ziel; 2 TFLOPS; Früheres NPU-Ziel; 32 TOPS; Stand im Bericht zum 3. Quartal 2026; Einführung nach RK3668; Leistungsziele stammen aus Juli 2025 und sind keine endgültigen Serienspezifikationen.; Informationsgrafik · Keine Chiparchitektur oder ArmSoM-Produktfotografie · 2026-10-28</desc><rect width="1200" height="680" rx="24" fill="#102c3c" /><path d="M0 0H1200V10H0Z" fill="#34C5DD" /><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="72" fill="#34C5DD" font-size="22.0">ArmSoM · PLATTFORMAUSBLICK</text><text x="60" y="140" fill="white" font-size="46.0" font-weight="bold">RK3688: Richtung des nächsten Flaggschiffs</text><text x="60" y="190" fill="#b7d6e2" font-size="23.0">Früher veröffentlichte Ziele und aktuelle Fortschritte getrennt betrachten.</text><rect x="60" y="235" width="530" height="135" rx="16" fill="#1b4053" /><text x="84" y="280" fill="#72dbe9" font-size="22.0">Plattformpositionierung</text><text x="84" y="327" fill="white" font-size="19.0" font-weight="bold">Nächstes Flaggschiff mit fortschrittlicher Fertigung</text><rect x="610" y="235" width="530" height="135" rx="16" fill="#1b4053" /><text x="634" y="280" fill="#72dbe9" font-size="22.0">Früheres GPU-Ziel</text><text x="634" y="327" fill="white" font-size="29.0" font-weight="bold">2 TFLOPS</text><rect x="60" y="390" width="530" height="135" rx="16" fill="#1b4053" /><text x="84" y="435" fill="#72dbe9" font-size="22.0">Früheres NPU-Ziel</text><text x="84" y="482" fill="white" font-size="29.0" font-weight="bold">32 TOPS</text><rect x="610" y="390" width="530" height="135" rx="16" fill="#1b4053" /><text x="634" y="435" fill="#72dbe9" font-size="22