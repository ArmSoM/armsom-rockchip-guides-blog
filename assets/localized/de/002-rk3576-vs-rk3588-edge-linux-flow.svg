<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">RK3576 oder RK3588? Das Board entscheidet</title><desc id="d">Schnittstellen → Anwendung → Linux → Abnahme</desc><rect width="1200" height="630" rx="24" fill="#f1f9fc"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="21" fill="#087d92" font-weight="700">ArmSoM  /  RK3576 · RK3588</text><text x="40" y="103" font-size="34" fill="#173750" font-weight="700">RK3576 oder RK3588? Das Board entscheidet</text><text x="40" y="143" font-size="23" fill="#173750" font-weight="400">Schnittstellen → Anwendung → Linux → Abnahme</text><rect x="40" y="176" width="540" height="353" rx="16" fill="white" stroke="#bcdde4"/><rect x="40" y="176" width="540" height="8" rx="4" fill="#34C5DD"/><text x="64" y="224" font-size="33" fill="#173750" font-weight="700">RK3576</text><text x="64" y="264" font-size="25" fill="#087d92" font-weight="700">Sige5 · CM5</text><text x="64" y="315" font-size="25" fill="#173750" font-weight="400">4 × A72 + 4 × A53</text><text x="64" y="366" font-size="25" fill="#173750" font-weight="400">Bis 16 GB adressierbarer RAM</text><text x="64" y="417" font-size="25" fill="#173750" font-weight="400">Sige5: NVMe PCIe 2.1 ×1</text><text x="64" y="468" font-size="25" fill="#173750" font-weight="400">Sige5: 2 × Gigabit Ethernet</text><rect x="620" y="176" width="540" height="353" rx="16" fill="white" stroke="#bcdde4"/><rect x="620" y="176" width="540" height="8" rx="4" fill="#34C5DD"/><text x="644" y="224" font-size="33" fill="#173750" font-weight="700">RK3588</text><text x="644" y="264" font-size="25" fill="#087d92" font-weight="700">Sige7 · AIM7 · LM7</text><text x="644" y="315" font-size="25" fill="#173750" font-weight="400">4 × A76 + 4 × A55</text><text x="644" y="366" font-size="25" fill="#173750" font-weight="400">Bis 32 GB adressierbarer RAM</text><text x="644" y="417" font-size="25" fill="#173750" font-weight="400">Sige7: NVMe PCIe 3.0 ×4</text><text x="644" y="468" font-size="25" fill="#173750" font-weight="400">Sige7: 2 × 2.5GbE</text><text x="40" y="584" font-size="24" fill="#173750" font-weight="400">SoC-Ressourcen ≠ Boardanschlüsse. Die gesamte Anwendung prüfen.</text></g></svg>
