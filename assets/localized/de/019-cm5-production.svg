<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081d32" /><text x="70" y="90" fill="#63d3ee" font-size="34.00" font-family="Arial, sans-serif">CM5-PRODUKTENTWICKLUNG</text><text x="70" y="145" fill="white" font-size="45.00" font-family="Arial, sans-serif" font-weight="700">Prototypen mit prüfbarem Carrier entwickeln</text><rect x="90" y="235" width="260" height="190" rx="18" fill="#174d45" stroke="#63d3ee" /><text x="160" y="315" fill="white" font-size="34" font-family="Arial">CM5</text><text x="135" y="365" fill="#b9d9e8" font-size="22" font-family="Arial">55 × 40 mm</text><path d="M390 330h150" stroke="#f4c542" stroke-width="8" /><rect x="580" y="235" width="260" height="190" rx="18" fill="#123b56" stroke="#63d3ee" /><text x="635" y="315" fill="white" font-size="34.00" font-family="Arial, sans-serif">Carrier</text><text x="625" y="365" fill="#b9d9e8" font-size="22.00" font-family="Arial, sans-serif">Versorgung + I/O</text><path d="M880 330h150" stroke="#f4c542" stroke-width="8" /><rect x="1040" y="235" width="110" height="190" rx="18" fill="#174d45" stroke="#63d3ee" /><text x="1057" y="315" fill="white" font-size="30" font-family="Arial">DVT</text><text x="80" y="535" fill="#b9d9e8" font-size="22.94" font-family="Arial, sans-serif">CM5 nutzt RK3576-Funktionen; Signalintegrität, Thermik und EMV müssen am Carrier geprüft werden.</text></svg>