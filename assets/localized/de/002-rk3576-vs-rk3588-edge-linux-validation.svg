<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Die gesamte Anwendung messen</title><desc id="d">Ein Inferenzaufruf ist nur ein Teil der Verarbeitung</desc><rect width="1200" height="630" rx="24" fill="#f1f9fc"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="21" fill="#087d92" font-weight="700">ArmSoM  /  RK3576 · RK3588</text><text x="40" y="103" font-size="36" fill="#173750" font-weight="700">Die gesamte Anwendung messen</text><text x="40" y="145" font-size="24" fill="#173750" font-weight="400">Ein Inferenzaufruf ist nur ein Teil der Verarbeitung</text><rect x="40" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="58" y="239" font-size="22" fill="#087d92" font-weight="700">EINGABE</text><text x="58" y="294" font-size="23" fill="#173750" font-weight="400">Kamera / Netzwerk / Speicher</text><text x="58" y="349" font-size="23" fill="#173750" font-weight="400">Treiber · Verbindungsmodus</text><text x="58" y="404" font-size="23" fill="#173750" font-weight="400">Bildrate · Eingabeformat</text><text x="392" y="326" font-size="29" fill="#087d92" font-weight="400">→</text><rect x="428" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="446" y="239" font-size="22" fill="#087d92" font-weight="700">VERARBEITUNG</text><text x="446" y="294" font-size="23" fill="#173750" font-weight="400">ISP / Decoder → RGA → NPU</text><text x="446" y="349" font-size="23" fill="#173750" font-weight="400">CPU · Puffer · Kopiervorgänge</text><text x="446" y="404" font-size="23" fill="#173750" font-weight="400">Genauigkeit · Warteschlangen</text><text x="780" y="326" font-size="29" fill="#087d92" font-weight="400">→</text><rect x="816" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="834" y="239" font-size="22" fill="#087d92" font-weight="700">AUSGABE</text><text x="834" y="294" font-size="23" fill="#173750" font-weight="400">Ergebnis / Anzeige / Aufnahme</text><text x="834" y="349" font-size="23" fill="#173750" font-weight="400">Gesamtlatenz p50 / p95</text><text x="834" y="404" font-size="23" fill="#173750" font-weight="400">Durchsatz · verlorene Frames</text><text x="40" y="521" font-size="28" fill="#173750" font-weight="700">Gleiche Anwendungslast auf beiden Kandidaten</text><text x="40" y="568" font-size="24" fill="#173750" font-weight="400">RAM, Temperatur, Softwarestand und Wiederherstellung erfassen</text></g></svg>
