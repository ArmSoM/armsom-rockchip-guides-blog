<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Измеряйте весь тракт приложения</title><desc id="d">Время инференса — только часть общей задержки</desc><rect width="1200" height="630" rx="24" fill="#f1f9fc"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="21" fill="#087d92" font-weight="700">ArmSoM  /  RK3576 · RK3588</text><text x="40" y="103" font-size="36" fill="#173750" font-weight="700">Измеряйте весь тракт приложения</text><text x="40" y="145" font-size="24" fill="#173750" font-weight="400">Время инференса — только часть общей задержки</text><rect x="40" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="58" y="239" font-size="22" fill="#087d92" font-weight="700">ВХОД</text><text x="58" y="294" font-size="23" fill="#173750" font-weight="400">Камера / сеть / накопитель</text><text x="58" y="349" font-size="23" fill="#173750" font-weight="400">Драйвер · режим соединения</text><text x="58" y="404" font-size="23" fill="#173750" font-weight="400">Частота кадров · формат</text><text x="392" y="326" font-size="29" fill="#087d92" font-weight="400">→</text><rect x="428" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="446" y="239" font-size="22" fill="#087d92" font-weight="700">ОБРАБОТКА</text><text x="446" y="294" font-size="23" fill="#173750" font-weight="400">ISP / декодер → RGA → NPU</text><text x="446" y="349" font-size="23" fill="#173750" font-weight="400">CPU · буферы · копирование</text><text x="446" y="404" font-size="23" fill="#173750" font-weight="400">Точность · глубина очереди</text><text x="780" y="326" font-size="29" fill="#087d92" font-weight="400">→</text><rect x="816" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="834" y="239" font-size="22" fill="#087d92" font-weight="700">ВЫХОД</text><text x="834" y="294" font-size="23" fill="#173750" font-weight="400">Результат / экран / запись</text><text x="834" y="349" font-size="23" fill="#173750" font-weight="400">Сквозная задержка p50 / p95</text><text x="834" y="404" font-size="23" fill="#173750" font-weight="400">Поток · потерянные кадры</text><text x="40" y="521" font-size="28" fill="#173750" font-weight="700">Одинаковая нагрузка для обеих платформ</text><text x="40" y="568" font-size="24" fill="#173750" font-weight="400">Фиксируйте RAM, температуру, версии ПО и восстановление</text></g></svg>
