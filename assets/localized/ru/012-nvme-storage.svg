<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#071b31" /><text x="70" y="90" fill="#63d3ee" font-size="34.00" font-family="Arial, sans-serif">ВЫБОР НАКОПИТЕЛЯ ARMSOM</text><text x="70" y="145" fill="white" font-size="46.00" font-family="Arial, sans-serif" font-weight="700">eMMC → NVMe: измеряйте весь путь</text><rect x="80" y="230" width="250" height="170" rx="18" fill="#123b56" stroke="#63d3ee" /><text x="125" y="300" fill="white" font-size="32" font-family="Arial">eMMC</text><text x="112" y="350" fill="#b9d9e8" font-size="22.00" font-family="Arial, sans-serif">Загрузка + эталон</text><path d="M350 315h160" stroke="#f4c542" stroke-width="8" marker-end="url(#a)" /><rect x="540" y="230" width="250" height="170" rx="18" fill="#174d45" stroke="#63d3ee" /><text x="585" y="300" fill="white" font-size="32" font-family="Arial">PCIe 2.1</text><text x="585" y="350" fill="#b9d9e8" font-size="22.00" font-family="Arial, sans-serif">Линии + нагрев</text><path d="M810 315h160" stroke="#f4c542" stroke-width="8" marker-end="url(#a)" /><rect x="980" y="230" width="150" height="170" rx="18" fill="#123b56" stroke="#63d3ee" /><text x="1000" y="300" fill="white" font-size="28" font-family="Arial">NVMe</text><text x="997" y="350" fill="#b9d9e8" font-size="15.62" font-family="Arial, sans-serif">Подтверждение</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f4c542" /></marker></defs><text x="80" y="520" fill="#b9d9e8" font-size="23.37" font-family="Arial, sans-serif">Sige5 / CM5 выводят PCIe 2.1 M-key; полоса интерфейса не гарантирует скорость приложения.</text></svg>