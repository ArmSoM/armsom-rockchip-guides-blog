<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081d32" /><text x="70" y="90" fill="#63d3ee" font-size="34.00" font-family="Arial, sans-serif">ПРОВЕРКА ВЫПУСКА OTA</text><text x="70" y="145" fill="white" font-size="45.00" font-family="Arial, sans-serif" font-weight="700">Безопасное обновление требует проверок</text><g font-family="Arial"><rect x="80" y="240" width="200" height="150" rx="16" fill="#123b56" stroke="#63d3ee" /><text x="132" y="300" fill="white" font-size="26.00" font-family="Arial, sans-serif">Сборка</text><text x="112" y="345" fill="#b9d9e8" font-size="19.04" font-family="Arial, sans-serif">Воспроизводимо</text><rect x="350" y="240" width="200" height="150" rx="16" fill="#174d45" stroke="#63d3ee" /><text x="400" y="300" fill="white" font-size="26.00" font-family="Arial, sans-serif">Подпись</text><text x="386" y="345" fill="#b9d9e8" font-size="18.83" font-family="Arial, sans-serif">Правила ключей</text><rect x="620" y="240" width="200" height="150" rx="16" fill="#123b56" stroke="#63d3ee" /><text x="660" y="300" fill="white" font-size="26.00" font-family="Arial, sans-serif">Поэтапно</text><text x="652" y="345" fill="#b9d9e8" font-size="20.00" font-family="Arial, sans-serif">A/B + питание</text><rect x="890" y="240" width="200" height="150" rx="16" fill="#174d45" stroke="#63d3ee" /><text x="942" y="300" fill="white" font-size="16.97" font-family="Arial, sans-serif">Восстановление</text><text x="936" y="345" fill="#b9d9e8" font-size="16.79" font-family="Arial, sans-serif">Путь через UART</text></g><text x="80" y="520" fill="#b9d9e8" font-size="24.00" font-family="Arial, sans-serif">Для Buildroot и Debian нужны проверки загрузки, подписей и отката конкретного изделия.</text></svg>