<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081d32" /><text x="70" y="90" fill="#63d3ee" font-size="34.00" font-family="Arial, sans-serif">ОЦЕНКА МИГРАЦИИ</text><text x="70" y="145" fill="white" font-size="43.00" font-family="Arial, sans-serif" font-weight="700">Выбирайте по ограничениям, не только по TOPS</text><g font-family="Arial" font-size="25" fill="white"><text x="100" y="245" font-size="16.00" font-family="Arial, sans-serif">Интерфейсы</text><rect x="300" y="220" width="650" height="35" fill="#174d45" /><text x="100" y="320" font-size="16.00" font-family="Arial, sans-serif">Производительность</text><rect x="300" y="295" width="520" height="35" fill="#123b56" /><text x="100" y="395" font-size="16.00" font-family="Arial, sans-serif">Изменения ПО</text><rect x="300" y="370" width="410" height="35" fill="#f4c542" /><text x="100" y="470" font-size="16.00" font-family="Arial, sans-serif">Питание / нагрев</text><rect x="300" y="445" width="580" height="35" fill="#63d3ee" /></g><text x="80" y="555" fill="#b9d9e8" font-size="22.24" font-family="Arial, sans-serif">Аксессуары Raspberry Pi могут подойти механически; нагрузкам Jetson CUDA нужен план переноса.</text></svg>