<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081d32" /><text x="70" y="90" fill="#63d3ee" font-size="34.00" font-family="Microsoft YaHei, Arial, sans-serif">OTA 发布检查</text><text x="70" y="145" fill="white" font-size="45.00" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700">安全更新需要完整的验证链</text><g font-family="Arial"><rect x="80" y="240" width="200" height="150" rx="16" fill="#123b56" stroke="#63d3ee" /><text x="132" y="300" fill="white" font-size="26.00" font-family="Microsoft YaHei, Arial, sans-serif">构建</text><text x="112" y="345" fill="#b9d9e8" font-size="20.00" font-family="Microsoft YaHei, Arial, sans-serif">可复现</text><rect x="350" y="240" width="200" height="150" rx="16" fill="#174d45" stroke="#63d3ee" /><text x="400" y="300" fill="white" font-size="26.00" font-family="Microsoft YaHei, Arial, sans-serif">签名</text><text x="386" y="345" fill="#b9d9e8" font-size="20.00" font-family="Microsoft YaHei, Arial, sans-serif">密钥策略</text><rect x="620" y="240" width="200" height="150" rx="16" fill="#123b56" stroke="#63d3ee" /><text x="660" y="300" fill="white" font-size="26.00" font-family="Microsoft YaHei, Arial, sans-serif">分阶段部署</text><text x="652" y="345" fill="#b9d9e8" font-size="20.00" font-family="Microsoft YaHei, Arial, sans-serif">A/B 与供电</text><rect x="890" y="240" width="200" height="150" rx="16" fill="#174d45" stroke="#63d3ee" /><text x="942" y="300" fill="white" font-size="26.00" font-family="Microsoft YaHei, Arial, sans-serif">恢复</text><text x="936" y="345" fill="#b9d9e8" font-size="20.00" font-family="Microsoft YaHei, Arial, sans-serif">串口恢复路径</text></g><text x="80" y="520" fill="#b9d9e8" font-size="24.00" font-family="Microsoft YaHei, Arial, sans-serif">Buildroot 与 Debian 流程仍需验证具体产品的启动、签名与回滚。</text></svg>