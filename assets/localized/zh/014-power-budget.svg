<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#071b31" /><text x="70" y="90" fill="#63d3ee" font-size="34.00" font-family="Microsoft YaHei, Arial, sans-serif">供电验证</text><text x="70" y="145" fill="white" font-size="45.00" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700">额定输入 ≠ 实测功耗</text><rect x="90" y="250" width="220" height="130" rx="16" fill="#123b56" stroke="#63d3ee" /><text x="145" y="305" fill="white" font-size="27.00" font-family="Microsoft YaHei, Arial, sans-serif">电源</text><text x="142" y="345" fill="#b9d9e8" font-size="20" font-family="Arial">PD / 5 V</text><path d="M330 315h110" stroke="#f4c542" stroke-width="8" /><rect x="460" y="250" width="250" height="130" rx="16" fill="#174d45" stroke="#63d3ee" /><text x="535" y="305" fill="white" font-size="27.00" font-family="Microsoft YaHei, Arial, sans-serif">开发板</text><text x="505" y="345" fill="#b9d9e8" font-size="20.00" font-family="Microsoft YaHei, Arial, sans-serif">SoC 与 I/O</text><path d="M730 315h110" stroke="#f4c542" stroke-width="8" /><rect x="860" y="250" width="250" height="130" rx="16" fill="#123b56" stroke="#63d3ee" /><text x="910" y="305" fill="white" font-size="27.00" font-family="Microsoft YaHei, Arial, sans-serif">负载</text><text x="895" y="345" fill="#b9d9e8" font-size="20.00" font-family="Microsoft YaHei, Arial, sans-serif">摄像头 / SSD</text><text x="90" y="520" fill="#b9d9e8" font-size="24.00" font-family="Microsoft YaHei, Arial, sans-serif">Sige5/Sige7：5–23 V 输入。CM5：建议 4 V，最高不超过 5.5 V。请验证峰值与线缆压降。</text></svg>