<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#071b31" /><text x="70" y="90" fill="#63d3ee" font-size="34.00" font-family="Microsoft YaHei, Arial, sans-serif">安全边界</text><text x="70" y="145" fill="white" font-size="45.00" font-family="Microsoft YaHei, Arial, sans-serif" font-weight="700">声明安全启动前，先记录完整启动链</text><path d="M170 360h860" stroke="#f4c542" stroke-width="8" /><g font-family="Arial"><circle cx="180" cy="360" r="70" fill="#123b56" stroke="#63d3ee" /><text x="135" y="370" fill="white" font-size="22">ROM</text><circle cx="430" cy="360" r="70" fill="#174d45" stroke="#63d3ee" /><text x="385" y="370" fill="white" font-size="22.00" font-family="Microsoft YaHei, Arial, sans-serif">加载程序</text><circle cx="680" cy="360" r="70" fill="#123b56" stroke="#63d3ee" /><text x="645" y="370" fill="white" font-size="22.00" font-family="Microsoft YaHei, Arial, sans-serif">内核</text><circle cx="930" cy="360" r="70" fill="#174d45" stroke="#63d3ee" /><text x="900" y="370" fill="white" font-size="22.00" font-family="Microsoft YaHei, Arial, sans-serif">根文件系统</text></g><text x="80" y="520" fill="#b9d9e8" font-size="24.00" font-family="Microsoft YaHei, Arial, sans-serif">安全性取决于 SoC 熔丝、密钥、引导程序与制造流程，而非开发板品牌。</text></svg>