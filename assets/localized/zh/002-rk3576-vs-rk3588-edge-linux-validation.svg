<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">测量完整的边缘应用链路</title><desc id="d">单次推理耗时只是整条链路中的一部分</desc><rect width="1200" height="630" rx="24" fill="#f1f9fc"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="21" fill="#087d92" font-weight="700">ArmSoM  /  RK3576 · RK3588</text><text x="40" y="103" font-size="36" fill="#173750" font-weight="700">测量完整的边缘应用链路</text><text x="40" y="145" font-size="24" fill="#173750" font-weight="400">单次推理耗时只是整条链路中的一部分</text><rect x="40" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="58" y="239" font-size="22" fill="#087d92" font-weight="700">输入</text><text x="58" y="294" font-size="23" fill="#173750" font-weight="400">摄像头 / 网络 / 存储</text><text x="58" y="349" font-size="23" fill="#173750" font-weight="400">传感器驱动 · 链路模式</text><text x="58" y="404" font-size="23" fill="#173750" font-weight="400">帧率 · 输入格式</text><text x="392" y="326" font-size="29" fill="#087d92" font-weight="400">→</text><rect x="428" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="446" y="239" font-size="22" fill="#087d92" font-weight="700">处理</text><text x="446" y="294" font-size="23" fill="#173750" font-weight="400">ISP / 解码 → RGA → NPU</text><text x="446" y="349" font-size="23" fill="#173750" font-weight="400">CPU 逻辑 · 缓冲 · 数据复制</text><text x="446" y="404" font-size="23" fill="#173750" font-weight="400">模型精度 · 队列深度</text><text x="780" y="326" font-size="29" fill="#087d92" font-weight="400">→</text><rect x="816" y="195" width="344" height="257" rx="16" fill="white" stroke="#bcdde4"/><text x="834" y="239" font-size="22" fill="#087d92" font-weight="700">输出</text><text x="834" y="294" font-size="23" fill="#173750" font-weight="400">结果 / 显示 / 录像</text><text x="834" y="349" font-size="23" fill="#173750" font-weight="400">端到端 p50 / p95 延迟</text><text x="834" y="404" font-size="23" fill="#173750" font-weight="400">持续吞吐 · 丢帧</text><text x="40" y="521" font-size="28" fill="#173750" font-weight="700">两个候选平台使用相同业务负载</text><text x="40" y="568" font-size="24" fill="#173750" font-weight="400">记录内存、温度、镜像版本和恢复表现</text></g></svg>
