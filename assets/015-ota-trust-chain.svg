<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#081d32"/><text x="70" y="90" fill="#63d3ee" font-size="34" font-family="Arial">OTA RELEASE GATE</text><text x="70" y="145" fill="white" font-size="45" font-family="Arial" font-weight="700">A safe update is a chain of evidence</text><g font-family="Arial"><rect x="80" y="240" width="200" height="150" rx="16" fill="#123b56" stroke="#63d3ee"/><text x="132" y="300" fill="white" font-size="26">Build</text><text x="112" y="345" fill="#b9d9e8" font-size="20">reproducible</text><rect x="350" y="240" width="200" height="150" rx="16" fill="#174d45" stroke="#63d3ee"/><text x="400" y="300" fill="white" font-size="26">Sign</text><text x="386" y="345" fill="#b9d9e8" font-size="20">key policy</text><rect x="620" y="240" width="200" height="150" rx="16" fill="#123b56" stroke="#63d3ee"/><text x="660" y="300" fill="white" font-size="26">Stage</text><text x="652" y="345" fill="#b9d9e8" font-size="20">A/B + power</text><rect x="890" y="240" width="200" height="150" rx="16" fill="#174d45" stroke="#63d3ee"/><text x="942" y="300" fill="white" font-size="26">Recover</text><text x="936" y="345" fill="#b9d9e8" font-size="20">serial path</text></g><text x="80" y="520" fill="#b9d9e8" font-size="24" font-family="Arial">Buildroot and Debian workflows still need product-specific boot, signing and rollback validation.</text></svg>
