<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4fafb"/>
<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Engineering decisions</text>
<text x="60" y="130" font-size="36" font-weight="700">VendorStorage: identify the data path</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Persistent API</text>
<text x="84" y="254" font-size="22">Media supported by the target SDK</text>
<text x="84" y="283" font-size="22">Identity, calibration and configuration</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. GKI RAM copy</text>
<text x="644" y="254" font-size="22">Data copied into memory during boot</text>
<text x="644" y="283" font-size="22">A RAM write is not a Flash write</text>
<rect x="60" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="390" font-size="25" font-weight="700">3. AIDL run / runWithCached</text>
<text x="84" y="429" font-size="22">Separate service calls and file caching</text>
<text x="84" y="458" font-size="22">Check versions, lengths and permissions</text>
<rect x="620" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="390" font-size="25" font-weight="700">4. Production acceptance</text>
<text x="644" y="429" font-size="22">Read back, reboot, power cycle, OTA</text>
<text x="644" y="458" font-size="22">Manage IDs and formats together</text>
<text x="60" y="592" font-size="20">Verify the configuration before implementation</text>
</g></svg>