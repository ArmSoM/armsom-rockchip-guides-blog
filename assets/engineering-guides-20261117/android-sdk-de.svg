<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Technische Entscheidungen</text>
<text x="60" y="130" font-size="36" font-weight="700">Android: zuerst die SDK-Auslieferung klären</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Vollständiges SDK</text>
<text x="84" y="254" font-size="22">System und Vendor in einer Lieferung</text>
<text x="84" y="283" font-size="22">Boardziel und Release festhalten</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. SSI-Systemseite</text>
<text x="644" y="254" font-size="22">system, system_ext und product</text>
<text x="644" y="283" font-size="22">Wiederverwendung braucht Kompatibilität</text>
