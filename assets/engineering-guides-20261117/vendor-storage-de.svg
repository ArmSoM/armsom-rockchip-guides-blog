<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4fafb"/>
<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Technische Entscheidungen</text>
<text x="60" y="130" font-size="36" font-weight="700">VendorStorage: den Datenweg bestimmen</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Persistente API</text>
<text x="84" y="254" font-size="22">Medien des jeweiligen SDKs</text>
<text x="84" y="283" font-size="22">Identität, Kalibrierung, Konfiguration</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. GKI-RAM-Kopie</text>
<text x="644" y="254" font-size="22">Beim Start in den Speicher übernommen</text>
<text x="644" y="283" font-size="22">RAM-Schreiben ist kein Flash-Schreiben</text>
<rect x="60" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="390" font-size="25" font-weight="700">3. AIDL run / runWithCached</text>
<text x="84" y="429" font-size="22">Serviceaufruf und Dateicache trennen</text>
<text x="84" y="458" font-size="22">Version, Länge und Zugriffsrechte prüfen</text>
<rect x="620" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="390" font-size="25" font-weight="700">4. Fertigungsabnahme</text>
<text x="644" y="429" font-size="22">Lesen, Neustart, Stromausfall, OTA</text>
<text x="644" y="458" font-size="22">IDs und Datenformate gemeinsam pflegen</text>
<text x="60" y="592" font-size="20">Konfiguration vor der Umsetzung prüfen</text>
</g></svg>