<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4fafb"/>
<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Technische Entscheidungen</text>
<text x="60" y="130" font-size="36" font-weight="700">RK3572 AMP: Ressourcen vor dem Start klären</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Ausführungskern wählen</text>
<text x="84" y="254" font-size="22">AP CPU3 oder RISC-V-MCU</text>
<text x="84" y="283" font-size="22">HAL- und RT-Thread-Images trennen</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. Ressourcen zuordnen</text>
<text x="644" y="254" font-size="22">Speicher, Takte, Pins und Interrupts</text>
<text x="644" y="283" font-size="22">Linux und Hilfskern klar abgrenzen</text>
<rect x="60" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="390" font-size="25" font-weight="700">3. Passende Images bauen</text>
<text x="84" y="429" font-size="22">boot, uboot, amp und Partitionstabelle</text>
<text x="84" y="458" font-size="22">Architektur, Adressen, RPMsg abstimmen</text>
<rect x="620" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="390" font-size="25" font-weight="700">4. Schrittweise abnehmen</text>
<text x="644" y="429" font-size="22">Hilfskern → Kanal → Anwendung</text>
<text x="644" y="458" font-size="22">Touch, Suspend, Neustart, Wiederherstellung</text>
<text x="60" y="592" font-size="20">Konfiguration vor der Umsetzung prüfen</text>
</g></svg>