<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4fafb"/>
<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Инженерный выбор</text>
<text x="60" y="130" font-size="36" font-weight="700">От характеристик SoC к устройству</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Определить нагрузку</text>
<text x="84" y="254" font-size="22">Модели, видео, экраны, реальное время</text>
<text x="84" y="283" font-size="22">Начать с задачи устройства</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. Проверить интерфейсы</text>
<text x="644" y="254" font-size="22">Контроллеры, мультиплексоры и PHY</text>
<text x="644" y="283" font-size="22">Отделить SoC от возможностей платы</text>
<rect x="60" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="390" font-size="25" font-weight="700">3. Проверить ПО</text>
<text x="84" y="429" font-size="22">SDK, ядро, Runtime и драйверы</text>
<text x="84" y="458" font-size="22">Испытать целевую систему</text>
<rect x="620" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="390" font-size="25" font-weight="700">4. Выбрать ArmSoM</text>
<text x="644" y="429" font-size="22">Отладочная плата → модуль и носитель</text>
<text x="644" y="458" font-size="22">Питание, охлаждение, сопровождение</text>
<text x="60" y="592" font-size="20">Проверьте конфигурацию перед внедрением</text>
</g></svg>