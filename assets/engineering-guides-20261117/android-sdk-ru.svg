<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4fafb"/>
<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Инженерный выбор</text>
<text x="60" y="130" font-size="36" font-weight="700">Android: сначала определите состав SDK</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Полный SDK</text>
<text x="84" y="254" font-size="22">System и vendor в одной поставке</text>
<text x="84" y="283" font-size="22">Зафиксировать плату и выпуск</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. Системная часть SSI</text>
<text x="644" y="254" font-size="22">system, system_ext и product</text>
<text x="644" y="283" font-size="22">Повторное применение требует проверки</text>
<rect x="60" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="390" font-size="25" font-weight="700">3. Аппаратная часть vendor</text>
<text x="84" y="429" font-size="22">HAL, ядро, драйверы и плата</text>
<text x="84" y="458" font-size="22">Уровни заморозки, VINTF, интерфейсы</text>
<rect x="620" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="390" font-size="25" font-weight="700">4. Сборка и регрессия</text>
<text x="644" y="429" font-size="22">Совместимые system, vendor и boot</text>
<text x="644" y="458" font-size="22">Загрузка — только начало испытаний</text>
<text x="60" y="592" font-size="20">Проверьте конфигурацию перед внедрением</text>
</g></svg>