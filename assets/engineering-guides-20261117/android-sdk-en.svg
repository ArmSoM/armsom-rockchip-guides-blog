<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4fafb"/>
<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Engineering decisions</text>
<text x="60" y="130" font-size="36" font-weight="700">Android upgrades: identify the delivery model</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Full SDK</text>
<text x="84" y="254" font-size="22">System and vendor in one delivery</text>
<text x="84" y="283" font-size="22">Record board target and release</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. SSI system side</text>
<text x="644" y="254" font-size="22">system, system_ext and product</text>
<text x="644" y="283" font-size="22">Reuse still requires compatibility</text>
<rect x="60" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="390" font-size="25" font-weight="700">3. Vendor hardware side</text>
<text x="84" y="429" font-size="22">HALs, kernel, drivers and board setup</text>
<text x="84" y="458" font-size="22">Freeze level, VINTF and interfaces</text>
<rect x="620" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="390" font-size="25" font-weight="700">4. Package and regression</text>
<text x="644" y="429" font-size="22">Matching system, vendor and boot</text>
<text x="644" y="458" font-size="22">Booting is only the first test</text>
<text x="60" y="592" font-size="20">Verify the configuration before implementation</text>
</g></svg>