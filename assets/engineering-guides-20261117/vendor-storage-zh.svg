<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4fafb"/>
<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · 方案选择</text>
<text x="60" y="130" font-size="36" font-weight="700">VendorStorage：先分清三种数据路径</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. 持久化 API</text>
<text x="84" y="254" font-size="22">由目标 SDK 支持的介质实现</text>
<text x="84" y="283" font-size="22">序列号、校准与配置数据</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. GKI 的 RAM 副本</text>
<text x="644" y="254" font-size="22">启动时获得的内存数据</text>
<text x="644" y="283" font-size="22">写入 RAM 不等于写入 Flash</text>
<rect x="60" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="390" font-size="25" font-weight="700">3. AIDL run / runWithCached</text>
<text x="84" y="429" font-size="22">服务请求与文件缓存分开</text>
<text x="84" y="458" font-size="22">核对版本、长度、权限和返回值</text>
<rect x="620" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="390" font-size="25" font-weight="700">4. 生产验收</text>
<text x="644" y="429" font-size="22">读回、重启、掉电、OTA</text>
<text x="644" y="458" font-size="22">ID 分配与数据格式一起管理</text>
<text x="60" y="592" font-size="20">核对配置后再实施</text>
</g></svg>