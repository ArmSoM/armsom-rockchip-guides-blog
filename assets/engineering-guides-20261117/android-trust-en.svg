<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4fafb"/>
<rect width="16" height="630" fill="#34C5DD"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" fill="#102c46">
<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Engineering decisions</text>
<text x="60" y="130" font-size="36" font-weight="700">Android TLS: four paths to verify</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Browser</text>
<text x="84" y="254" font-size="22">Chrome version and root policy</text>
<text x="84" y="283" font-size="22">Browser success is not an app fix</text>
<rect x="620" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="215" font-size="25" font-weight="700">2. System and APEX</text>
<text x="644" y="254" font-size="22">System certificates and Conscrypt</text>
<text x="644" y="283" font-size="22">Identify the active trust anchors</text>
<rect x="60" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="390" font-size="25" font-weight="700">3. Application TLS</text>
<text x="84" y="429" font-size="22">Java, native libraries, bundled CAs</text>
<text x="84" y="458" font-size="22">Dependencies and pinning policies</text>
<rect x="620" y="352" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="644" y="390" font-size="25" font-weight="700">4. Firmware acceptance</text>
<text x="644" y="429" font-size="22">Valid connections and negative tests</text>
<text x="644" y="458" font-size="22">Updates, reboot and recovery</text>
<text x="60" y="592" font-size="20">Verify the configuration before implementation</text>
</g></svg>