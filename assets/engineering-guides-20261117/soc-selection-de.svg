<text x="60" y="64" font-size="25" font-weight="700">ArmSoM · Technische Entscheidungen</text>
<text x="60" y="130" font-size="36" font-weight="700">Von der SoC-Spezifikation zum Produkt</text>
<rect x="60" y="177" width="520" height="145" rx="16" fill="white" stroke="#a7d8e0"/>
<text x="84" y="215" font-size="25" font-weight="700">1. Arbeitslast festlegen</text>
<text x="84" y="254" font-size="22">Modelle, Video, Displays und Echtzeit</text>
<text x="84" y="283" font-size="22">Die konkrete Aufgabe zuerst</text>
