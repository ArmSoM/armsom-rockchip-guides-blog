<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#071b31"/><text x="70" y="90" fill="#63d3ee" font-size="34" font-family="Arial">INDUSTRIAL FIT</text><text x="70" y="145" fill="white" font-size="45" font-family="Arial" font-weight="700">Forge1 is a control board, not a Jetson Nano clone</text><rect x="90" y="240" width="300" height="180" rx="18" fill="#174d45" stroke="#63d3ee"/><text x="165" y="315" fill="white" font-size="36" font-family="Arial">Forge1</text><text x="133" y="365" fill="#b9d9e8" font-size="22" font-family="Arial">RK3506J · -40…85°C</text><path d="M430 330h160" stroke="#f4c542" stroke-width="8"/><rect x="630" y="240" width="430" height="180" rx="18" fill="#123b56" stroke="#63d3ee"/><text x="700" y="315" fill="white" font-size="30" font-family="Arial">RS485 · CAN · RMII</text><text x="700" y="365" fill="#b9d9e8" font-size="22" font-family="Arial">industrial interfaces</text><text x="80" y="535" fill="#b9d9e8" font-size="24" font-family="Arial">512 MB DDR3L and Buildroot favor deterministic control/HMI workloads, not CUDA-class AI.</text></svg>
