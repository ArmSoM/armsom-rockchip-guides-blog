<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img"><title>从芯片规划到可用产品</title><desc>关注每个阶段的交付内容，避免把样片时间当成上市时间。；01 · 规格确认：计算口径 / 接口 / 功耗；02 · 样片与软件：芯片供应 / SDK / 驱动；03 · 板级验证：功能 / 稳定性 / 散热；04 · 产品交付：配置 / 文档 / 供货；开发评估示意；不表示 ArmSoM 已完成上述阶段。</desc><rect width="1200" height="680" rx="24" fill="#102c3c"/><path d="M0 0H1200V10H0Z" fill="#34C5DD"/><g font-family="Arial, Microsoft YaHei, sans-serif"><text x="60" y="72" fill="#34C5DD" font-size="22">ArmSoM · PLATFORM OUTLOOK</text><text x="60" y="140" fill="white" font-size="46" font-weight="bold">从芯片规划到可用产品</text><text x="60" y="190" fill="#b7d6e2" font-size="23">关注每个阶段的交付内容，避免把样片时间当成上市时间。</text><rect x="60" y="235" width="530" height="135" rx="16" fill="#1b4053"/><text x="84" y="280" fill="#72dbe9" font-size="22">01 · 规格确认</text><text x="84" y="327" fill="white" font-size="29" font-weight="bold">计算口径 / 接口 / 功耗</text><rect x="610" y="235" width="530" height="135" rx="16" fill="#1b4053"/><text x="634" y="280" fill="#72dbe9" font-size="22">02 · 样片与软件</text><text x="634" y="327" fill="white" font-size="29" font-weight="bold">芯片供应 / SDK / 驱动</text><rect x="60" y="390" width="530" height="135" rx="16" fill="#1b4053"/><text x="84" y="435" fill="#72dbe9" font-size="22">03 · 板级验证</text><text x="84" y="482" fill="white" font-size="29" font-weight="bold">功能 / 稳定性 / 散热</text><rect x="610" y="390" width="530" height="135" rx="16" fill="#1b4053"/><text x="634" y="435" fill="#72dbe9" font-size="22">04 · 产品交付</text><text x="634" y="482" fill="white" font-size="29" font-weight="bold">配置 / 文档 / 供货</text><text x="60" y="600" fill="#c6d9e0" font-size="21">开发评估示意；不表示 ArmSoM 已完成上述阶段。</text><text x="60" y="638" fill="#8fb1c0" font-size="18">资料信息图 · 非芯片架构图 / 非 ArmSoM 产品实物 · 2026-10-28</text></g></svg>